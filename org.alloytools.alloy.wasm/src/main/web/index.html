<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alloy WASM - Browser Demo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, #e94560, #0f3460);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle {
            color: #8892b0;
            margin-top: 10px;
        }
        
        .editor-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        @media (max-width: 768px) {
            .editor-container {
                grid-template-columns: 1fr;
            }
        }
        
        .panel {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .panel-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #ccd6f6;
        }
        
        textarea {
            width: 100%;
            height: 300px;
            background: #0a0a0f;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px;
            color: #64ffda;
            font-family: 'Fira Code', 'Consolas', monospace;
            font-size: 14px;
            resize: vertical;
        }
        
        textarea:focus {
            outline: none;
            border-color: #e94560;
        }
        
        .output {
            width: 100%;
            height: 300px;
            background: #0a0a0f;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px;
            color: #8892b0;
            font-family: 'Fira Code', 'Consolas', monospace;
            font-size: 13px;
            overflow: auto;
            white-space: pre-wrap;
        }
        
        .output.success {
            border-color: #64ffda;
        }
        
        .output.error {
            border-color: #e94560;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }
        
        button {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: linear-gradient(90deg, #e94560, #e94560);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(233, 69, 96, 0.4);
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #ccd6f6;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .status {
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        .status.loading {
            background: rgba(233, 69, 96, 0.2);
            color: #e94560;
        }
        
        .status.ready {
            background: rgba(100, 255, 218, 0.2);
            color: #64ffda;
        }
        
        .examples {
            margin-top: 30px;
        }
        
        .example-btn {
            padding: 8px 16px;
            margin: 5px;
            background: rgba(100, 255, 218, 0.1);
            border: 1px solid rgba(100, 255, 218, 0.3);
            border-radius: 5px;
            color: #64ffda;
            font-size: 0.9rem;
            cursor: pointer;
        }
        
        .example-btn:hover {
            background: rgba(100, 255, 218, 0.2);
        }
        
        .footer {
            text-align: center;
            margin-top: 40px;
            color: #8892b0;
            font-size: 0.9rem;
        }
        
        .footer a {
            color: #64ffda;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚗️ Alloy WASM</h1>
            <p class="subtitle">Run Alloy models directly in your browser</p>
        </header>
        
        <div id="status" class="status loading">
            Loading Alloy WASM module...
        </div>
        
        <div class="controls">
            <button class="btn-primary" onclick="executeModel()" id="runBtn" disabled>
                ▶ Run Model
            </button>
            <button class="btn-secondary" onclick="parseModel()" id="parseBtn" disabled>
                ✓ Parse Only
            </button>
            <button class="btn-secondary" onclick="clearOutput()">
                ✕ Clear
            </button>
        </div>
        
        <div class="editor-container">
            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title">📝 Alloy Model</span>
                </div>
                <textarea id="editor" spellcheck="false">// Simple example: Transitive closure
sig Person {
    friend: set Person
}

// Find a friendship cycle
run FindCycle {
    some p: Person | p in p.^friend
} for 3 Person</textarea>
            </div>
            
            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title">📊 Output</span>
                </div>
                <div id="output" class="output">Output will appear here...</div>
            </div>
        </div>
        
        <div class="examples">
            <p style="color: #8892b0; margin-bottom: 10px;">Try an example:</p>
            <button class="example-btn" onclick="loadExample('basic')">Basic Sig</button>
            <button class="example-btn" onclick="loadExample('relation')">Relations</button>
            <button class="example-btn" onclick="loadExample('constraint')">Constraints</button>
            <button class="example-btn" onclick="loadExample('check')">Check Assertion</button>
        </div>
        
        <footer class="footer">
            <p>Powered by <a href="https://alloytools.org" target="_blank">Alloy Tools</a> | 
            Built for <a href="https://github.com/juriti-labs/jurity-alloy-forge-studio" target="_blank">Jurity Alloy Forge Studio</a></p>
        </footer>
    </div>
    
    <script>
        // Example models
        const examples = {
            basic: `// Basic signature example
sig Animal {}
sig Dog extends Animal {}
sig Cat extends Animal {}

run { #Dog > 0 and #Cat > 0 } for 5`,
            
            relation: `// Relations and navigation
sig Person {
    father: lone Person,
    mother: lone Person
}

// Find someone who has the same father and mother
run { some p: Person | p.father = p.mother } for 4`,
            
            constraint: `// Constraints and facts
sig Node {
    next: lone Node
}

// Linked list is acyclic
fact Acyclic {
    no n: Node | n in n.^next
}

run {} for 4`,
            
            check: `// Assertion checking
sig Set {
    elements: set Element
}
sig Element {}

// Union is commutative
assert UnionCommutative {
    all s1, s2: Set | s1.elements + s2.elements = s2.elements + s1.elements
}

check UnionCommutative for 3`
        };
        
        // Global alloy instance
        let alloy = null;
        
        // Initialize when page loads
        window.onload = function() {
            // In a real scenario, this would load the compiled WASM/JS module
            // For now, we simulate the API for demonstration
            setTimeout(initializeAlloy, 1000);
        };
        
        function initializeAlloy() {
            // Check if AlloyWasm is loaded
            if (typeof AlloyWasm !== 'undefined') {
                alloy = new AlloyWasm();
                setReady();
            } else {
                // Simulate the API for demo purposes
                alloy = createMockAlloy();
                setReady();
            }
        }
        
        function createMockAlloy() {
            // Mock implementation for demo when WASM isn't loaded
            return {
                execute: function(code) {
                    return JSON.stringify({
                        status: 'instance-found',
                        durationMs: Math.floor(Math.random() * 100) + 10,
                        isCheck: code.includes('check '),
                        commandLabel: 'run$1',
                        summary: 'Instance found - constraints are satisfiable',
                        errors: [],
                        instanceStats: {
                            atomCount: Math.floor(Math.random() * 10) + 1,
                            signatureCount: 3,
                            relationCount: 2,
                            tupleCount: 5,
                            skolemCount: 0,
                            traceLength: 1,
                            loopState: -1
                        },
                        hasSolution: true
                    });
                },
                parse: function(code) {
                    // Simulate parse errors for obviously broken code
                    if (code.includes('sig {')) {
                        return JSON.stringify({
                            status: 'parse-error',
                            durationMs: 5,
                            errors: [{
                                kind: 'parse',
                                message: 'Expected signature name after "sig"',
                                lineStart: 1,
                                columnStart: 5
                            }],
                            hasSolution: false
                        });
                    }
                    return JSON.stringify({
                        status: null,
                        durationMs: 10,
                        summary: 'Module parsed and type-checked successfully',
                        errors: [],
                        hasSolution: false
                    });
                },
                getVersion: function() {
                    return JSON.stringify({
                        name: 'alloy-wasm',
                        version: '6.3.0',
                        alloyVersion: '6',
                        description: 'Alloy Analyzer for WebAssembly/JavaScript',
                        capabilities: ['parse', 'execute', 'validate']
                    });
                }
            };
        }
        
        function setReady() {
            const status = document.getElementById('status');
            status.textContent = '✓ Alloy WASM is ready!';
            status.className = 'status ready';
            document.getElementById('runBtn').disabled = false;
            document.getElementById('parseBtn').disabled = false;
            
            // Show version info
            try {
                const version = JSON.parse(alloy.getVersion());
                console.log('Alloy WASM loaded:', version);
            } catch (e) {
                console.error('Error getting version:', e);
            }
        }
        
        function executeModel() {
            const code = document.getElementById('editor').value;
            const output = document.getElementById('output');
            
            output.textContent = 'Executing...';
            output.className = 'output';
            
            try {
                const resultJson = alloy.execute(code);
                const result = JSON.parse(resultJson);
                displayResult(result);
            } catch (e) {
                output.textContent = 'Error: ' + e.message;
                output.className = 'output error';
            }
        }
        
        function parseModel() {
            const code = document.getElementById('editor').value;
            const output = document.getElementById('output');
            
            output.textContent = 'Parsing...';
            output.className = 'output';
            
            try {
                const resultJson = alloy.parse(code);
                const result = JSON.parse(resultJson);
                displayResult(result);
            } catch (e) {
                output.textContent = 'Error: ' + e.message;
                output.className = 'output error';
            }
        }
        
        function displayResult(result) {
            const output = document.getElementById('output');
            let text = '';
            
            // Status
            if (result.status === 'instance-found') {
                text += '✓ SATISFIABLE - Instance found!\n\n';
                output.className = 'output success';
            } else if (result.status === 'no-instance') {
                text += '✗ UNSATISFIABLE - No instance found\n\n';
                output.className = 'output';
            } else if (result.status === 'parse-error' || result.status === 'type-error') {
                text += '✗ ' + result.status.toUpperCase().replace('-', '_') + '\n\n';
                output.className = 'output error';
            } else if (!result.status) {
                text += '✓ Parsing successful!\n\n';
                output.className = 'output success';
            } else {
                text += 'Status: ' + result.status + '\n\n';
                output.className = 'output';
            }
            
            // Summary
            if (result.summary) {
                text += result.summary + '\n\n';
            }
            
            // Errors
            if (result.errors && result.errors.length > 0) {
                text += 'Errors:\n';
                result.errors.forEach(err => {
                    text += `  [${err.kind}] ${err.message}`;
                    if (err.lineStart) {
                        text += ` (line ${err.lineStart}, col ${err.columnStart})`;
                    }
                    text += '\n';
                });
                text += '\n';
            }
            
            // Instance stats
            if (result.instanceStats) {
                text += 'Instance Statistics:\n';
                text += `  Atoms: ${result.instanceStats.atomCount}\n`;
                text += `  Signatures: ${result.instanceStats.signatureCount}\n`;
                text += `  Relations: ${result.instanceStats.relationCount}\n`;
                text += `  Tuples: ${result.instanceStats.tupleCount}\n`;
                if (result.instanceStats.skolemCount > 0) {
                    text += `  Skolems: ${result.instanceStats.skolemCount}\n`;
                }
                text += '\n';
            }
            
            // Duration
            text += `Execution time: ${result.durationMs}ms`;
            
            output.textContent = text;
        }
        
        function clearOutput() {
            const output = document.getElementById('output');
            output.textContent = 'Output will appear here...';
            output.className = 'output';
        }
        
        function loadExample(name) {
            const editor = document.getElementById('editor');
            if (examples[name]) {
                editor.value = examples[name];
            }
        }
    </script>
</body>
</html>
